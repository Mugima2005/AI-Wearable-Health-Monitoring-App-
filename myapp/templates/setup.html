<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health & Weather Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
    body {
        font-family: Arial, sans-serif;
        color: black;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-image: url('https://saal.ai/wp-content/uploads/2023/02/Medicine-Artifical-Intelligence.jpg');
        background-size: cover;
        background-position: center;
        text-align: center;
    }
    header {
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 20px;
    }
    h2, h1 {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    .container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 20px;
        padding: 20px;
        flex-wrap: nowrap;
    }
    .box {
        width: 30%;
        padding: 20px;
        border-radius: 8px;
        background-color: rgba(255, 255, 255, 0.8);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        min-height: 350px;
    }
    input, select, button {
        margin: 10px;
        padding: 10px;
        width: 90%;
        border-radius: 5px;
        border: 1px solid #ccc;
    }
    button {
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
    }
    button:hover {
        background-color: #45a049;
    }
    #weather, #healthSummary, #googleFitData {
        display: none;
        font-size: 18px;
        font-weight: bold;
    }
</style>
</head>
<body>

<header>
<h1>Health & Weather Tracker</h1>
</header>

<div class="container">
    <div class="box">
        <h2>Set Up Your Health Details</h2>
        <form id="healthForm">
            <input type="text" id="name" placeholder="Enter Name" required><br>
            <input type="number" id="weight" placeholder="Enter Weight (kg)" required><br>
            <label for="sex">Select Sex: </label>
            <select id="sex" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select><br>
            <input type="number" id="height" placeholder="Enter Height (cm)" required><br>
            <label for="mood">Select Mood: </label>
            <select id="mood" required>
                <option value="Happy">Happy</option>
                <option value="Sad">Sad</option>
                <option value="Neutral">Neutral</option>
                <option value="Stressed">Stressed</option>
                <option value="Energetic">Energetic</option>
            </select><br>
            <input type="number" id="sleep" placeholder="Sleep Hours" required><br>
            <button type="submit">Save Details</button>
        </form>

        <div id="healthSummary">
            <h2>Saved Health Details:</h2>
            <p id="summaryText"></p>
            <button onclick="editDetails()">Edit Details</button>
        </div>
    </div>

    <div class="box">
        <h2>Weather Details (Coimbatore)</h2>
        <button id="weatherBtn" onclick="fetchWeather()">Get Weather</button>
        <div id="weather">
            <p>Weather details will appear here...</p>
        </div>
    </div>

    <div class="box">
        <h2>Google Fit Data</h2>
        <button onclick="authenticateGoogleFit()">Connect Google Fit</button>
        <div id="googleFitData">
            <p>Fetching data...</p>
        </div>
    </div>
</div>

<script>
    document.getElementById("healthForm").addEventListener("submit", function(event) {
        event.preventDefault();

        // Save input values
        const name = document.getElementById("name").value;
        const weight = document.getElementById("weight").value;
        const sex = document.getElementById("sex").value;
        const height = document.getElementById("height").value;
        const mood = document.getElementById("mood").value;
        const sleep = document.getElementById("sleep").value;

        localStorage.setItem("name", name);
        localStorage.setItem("weight", weight);
        localStorage.setItem("sex", sex);
        localStorage.setItem("height", height);
        localStorage.setItem("mood", mood);
        localStorage.setItem("sleep", sleep);

        // Show summary
        document.getElementById("summaryText").innerHTML = `
            Name: ${name}<br>
            Weight: ${weight} kg<br>
            Sex: ${sex}<br>
            Height: ${height} cm<br>
            Mood: ${mood}<br>
            Sleep: ${sleep} hours
        `;
        document.getElementById("healthForm").style.display = "none";
        document.getElementById("healthSummary").style.display = "block";
    });

    function editDetails() {
        document.getElementById("healthForm").style.display = "block";
        document.getElementById("healthSummary").style.display = "none";
    }

    window.onload = function() {
        if (localStorage.getItem("name")) {
            document.getElementById("name").value = localStorage.getItem("name");
            document.getElementById("weight").value = localStorage.getItem("weight");
            document.getElementById("sex").value = localStorage.getItem("sex");
            document.getElementById("height").value = localStorage.getItem("height");
            document.getElementById("mood").value = localStorage.getItem("mood");
            document.getElementById("sleep").value = localStorage.getItem("sleep");
        }
    };

    const WEATHER_API_KEY = "e81d06ea6a1046ad25663f436b269bce";

    function fetchWeather() {
        const weatherDiv = document.getElementById("weather");
        weatherDiv.style.display = "block";
        fetch(`https://api.openweathermap.org/data/2.5/weather?q=Coimbatore&appid=${WEATHER_API_KEY}&units=metric`)
            .then(response => response.json())
            .then(data => {
                weatherDiv.innerHTML = ` 
                    Weather: ${data.weather[0].description}<br>
                    Temperature: ${data.main.temp}°C<br>
                    Humidity: ${data.main.humidity}%<br>
                `;
            })
            .catch(() => {
                weatherDiv.innerHTML = "Unable to fetch weather data.";
            });
    }

    function authenticateGoogleFit() {
        const CLIENT_ID = "513151902284-ul93au4g3aqhdp8b8jibrimk4b5p0q3t.apps.googleusercontent.com";
        const SCOPES = "https://www.googleapis.com/auth/fitness.activity.read https://www.googleapis.com/auth/fitness.body.read";
        const REDIRECT_URI = "http://127.0.0.1:8000/";

        google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            redirect_uri: REDIRECT_URI,
            callback: (tokenResponse) => {
                if (tokenResponse.access_token) {
                    fetchGoogleFitData(tokenResponse.access_token);
                } else {
                    alert("Failed to authenticate.");
                }
            }
        }).requestAccessToken();
    }
</script>

<button onclick="redirectToDashboard()">Proceed to Dashboard</button>

<script>
    function redirectToDashboard() {
        window.location.href = "/setup/dashboard/";
    }
</script>

</body>
</html>
