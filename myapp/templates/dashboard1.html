<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Health Assistant</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
        display: flex;
        height: 100vh;
        background: #f4f4f4;
    }
    /* Sidebar */
    .sidebar {
        width: 250px;
        background: #0077B6;
        color: white;
        display: flex;
        flex-direction: column;
        padding: 20px;
    }
    .sidebar h2 {
        margin-bottom: 20px;
        text-align: center;
    }
    .menu-item {
        padding: 15px;
        margin: 5px 0;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.3s;
    }
    .menu-item:hover {
        background: rgba(255, 255, 255, 0.2);
    }
    /* Main Content */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    /* Chatbot Section */
    .chat-container {
        width: 75%;
        height: 80vh;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        padding: 20px;
        display: flex;
        flex-direction: column;
        position: relative;
    }
    .chat-title {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
    }
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column-reverse;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #fafafa;
    }
    .chat-input {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }
    .chat-input input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .chat-input button {
        background: #0077B6;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
    }
</style>
</head>
<body>
    <div class="sidebar">
        <h2>Health Assistant</h2>
        <div class="menu-item">❤️ Health Data</div>
        <div class="menu-item">🎯 Set Goals</div>
        <div class="menu-item">📊 Visual Insights</div>
        <div class="menu-item">🥗 Diet Plan</div>
        <div class="menu-item">📰 Latest News</div>
    </div>
    <div class="main">
        <div class="chat-container">
            <div class="chat-title">AI Chatbot Assistant</div>
            <div class="chat-messages" id="chatMessages">
                <!-- Chat messages will appear here -->
            </div>
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Send message here...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <script>
        function sendMessage() {
            let input = document.getElementById('userInput').value;
            if (input.trim() === '') return;
            let chatMessages = document.getElementById('chatMessages');
            let userMessage = `<div><strong>You:</strong> ${input}</div>`;
            chatMessages.innerHTML = userMessage + chatMessages.innerHTML;
            document.getElementById('userInput').value = '';
        }
    </script>
</body>
</html>
