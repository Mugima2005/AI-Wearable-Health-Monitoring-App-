{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: "Poppins", sans-serif;
            text-align: center;
            margin: 20px;
            background: url("https://saal.ai/wp-content/uploads/2023/02/Medicine-Artifical-Intelligence.jpg") no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background: rgb(255, 255, 255);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 28px;
            color: #0277bd;
        }

        .mood-selector, .buttons {
            margin: 20px 0;
        }

        select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .steps-btn { background: #0288d1; color: white; }
        .heart-btn { background: #ff6f61; color: white; }
        .active { box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3); }

        canvas { max-width: 100%; }

        .insights {
            background: rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Health Dashboard</h1>
        <p>Analyze health trends with interactive charts.</p>
        
        <div class="mood-selector">
            <label for="mood">🧠 Select Your Mood: </label>
            <select id="mood" onchange="updateMood()">
                <option value="happy">😃 Happy</option>
                <option value="stressed">😡 Stressed</option>
                <option value="relaxed">😌 Relaxed</option>
                <option value="sad">😢 Sad</option>
                <option value="excited">🤩 Excited</option>
            </select>
        </div>

        <div class="buttons">
            <button id="stepsBtn" class="steps-btn active" onclick="updateChart('steps')">🚶 Steps</button>
            <button id="heartBtn" class="heart-btn" onclick="updateChart('heartRate')">❤ Heart Rate</button>
        </div>

        <canvas id="healthChart"></canvas>

        <div id="insights" class="insights">
            <h3>💡 AI Health Insights</h3>
            <p id="insightText">Your steps have increased by 12% this week! Keep up the good work! 🚀</p>
        </div>
    </div>

    <script>
        const mockData = [
            { day: "Mon", steps: 5000, heartRate: 72 },
            { day: "Tue", steps: 8000, heartRate: 75 },
            { day: "Wed", steps: 6000, heartRate: 70 },
            { day: "Thu", steps: 9000, heartRate: 78 },
            { day: "Fri", steps: 7500, heartRate: 74 },
            { day: "Sat", steps: 10000, heartRate: 80 },
            { day: "Sun", steps: 11000, heartRate: 76 },
        ];

        let currentMetric = "steps";
        let currentMood = "happy";
        const ctx = document.getElementById("healthChart").getContext("2d");

        const moodHeartRates = {
            happy: [70, 72, 74, 76, 78, 75, 74],
            stressed: [90, 92, 95, 97, 100, 98, 96],
            relaxed: [65, 64, 63, 62, 61, 60, 62],
            sad: [80, 82, 84, 85, 87, 85, 83],
            excited: [95, 100, 105, 108, 110, 107, 105]
        };

        let healthChart = new Chart(ctx, {
            type: "line",
            data: {
                labels: mockData.map(d => d.day),
                datasets: [{
                    label: "Steps Count",
                    data: mockData.map(d => d.steps),
                    borderColor: "#0288d1",
                    borderWidth: 3,
                    pointRadius: 5,
                    pointBackgroundColor: "#0288d1",
                    fill: false,
                    tension: 0.3,
                }]
            },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: false } }
            }
        });

        function updateChart(metric) {
            currentMetric = metric;
            if (metric === "heartRate") {
                healthChart.data.datasets[0].data = moodHeartRates[currentMood];
                healthChart.data.datasets[0].label = "Heart Rate (BPM)";
                healthChart.data.datasets[0].borderColor = "#ff6f61";
                healthChart.data.datasets[0].pointBackgroundColor = "#ff6f61";
            } else {
                healthChart.data.datasets[0].data = mockData.map(d => d.steps);
                healthChart.data.datasets[0].label = "Steps Count";
                healthChart.data.datasets[0].borderColor = "#0288d1";
                healthChart.data.datasets[0].pointBackgroundColor = "#0288d1";
            }
            healthChart.update();
            updateInsights();
        }

        function updateMood() {
            currentMood = document.getElementById("mood").value;
            if (currentMetric === "heartRate") updateChart("heartRate");
            updateInsights();
        }

        function updateInsights() {
            const insights = {
                happy: "😊 You're feeling great! Keep up the positivity!",
                stressed: "😬 Take a deep breath, relax, and unwind!",
                relaxed: "🌿 Great! Relaxation is key to good health.",
                sad: "😞 Try listening to music or taking a walk to feel better.",
                excited: "🎉 You're full of energy! Use it wisely!"
            };
            document.getElementById("insightText").innerText = insights[currentMood];
        }
    </script>
</body>
</html>
