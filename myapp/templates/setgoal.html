<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Health Goals</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://saal.ai/wp-content/uploads/2023/02/Medicine-Artifical-Intelligence.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 50%;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .header {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .goal-section {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .button:hover {
            background: #0056b3;
        }
        .back-button {
            background: #6c757d;
        }
        .back-button:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Set Your Health Goals</div>
        
        <div class="goal-section">
            <label for="steps">Daily Step Goal:</label>
            <input type="number" id="steps" placeholder="Enter steps">
        </div>
        
        <div class="goal-section">
            <label for="calories">Daily Calories Burnt Goal:</label>
            <input type="number" id="calories" placeholder="Enter calories">
        </div>
        
        <div class="goal-section">
            <label for="water">Daily Water Intake Goal (L):</label>
            <input type="number" step="0.1" id="water" placeholder="Enter liters">
        </div>
        
        <div class="goal-section">
            <label for="sleep">Daily Sleep Hours Goal:</label>
            <input type="number" step="0.5" id="sleep" placeholder="Enter hours">
        </div>
        
        <button class="button">Save Goals</button>
        <a href="dashboard.html" class="button back-button">Back to Dashboard</a>
    </div>
</body>
</html>
