<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Health News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .news-ticker {
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            animation: ticker 10s linear infinite;
        }
        @keyframes ticker {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
        /* Background Image */
        body {
            background: url("https://saal.ai/wp-content/uploads/2023/02/Medicine-Artifical-Intelligence.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Logo Styling */
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="container mx-auto p-6 max-w-3xl bg-white rounded-lg shadow-lg text-center">
        
        <!-- Logo -->
        <img src="{% static 'shared image.png' %}" alt="Logo" class="logo mb-2">

        <h1 class="text-3xl font-bold text-blue-600">📰 Latest Health News</h1>

        <!-- News Ticker -->
        <div class="bg-blue-600 text-white p-2 mt-4 overflow-hidden">
            <div class="news-ticker" id="news-ticker">Loading headlines...</div>
        </div>

        <!-- AI Summary -->
        <div class="mt-4 p-4 bg-blue-100 rounded">
            <h3 class="font-bold">🤖 AI Summary</h3>
            <p id="ai-summary">Fetching news summary...</p>
        </div>

        <!-- News Table -->
        <table class="mt-4 w-full border-collapse border">
            <thead>
                <tr class="bg-blue-600 text-white">
                    <th class="p-2">Title</th>
                    <th class="p-2">Date</th>
                    <th class="p-2">Link</th>
                </tr>
            </thead>
            <tbody id="news-container">
                <tr>
                    <td colspan="3" class="text-center p-4">No news available.</td>
                </tr>
            </tbody>
        </table>

        <!-- Load More Button -->
        <div class="text-center mt-4">
            <button id="get-news" class="bg-blue-600 text-white p-2 rounded shadow-md hover:bg-blue-700 transition">
                Get News
            </button>
        </div>
    </div>

    <script>
        document.getElementById("get-news").addEventListener("click", function() {
            fetch("{% url 'get_health_news' %}?page=1", { 
                headers: { "X-Requested-With": "XMLHttpRequest" } 
            })
            .then(response => response.json())
            .then(data => {
                let newsContainer = document.getElementById("news-container");
                let newsTicker = document.getElementById("news-ticker");
                let aiSummary = document.getElementById("ai-summary");

                if (data.articles.length === 0) {
                    aiSummary.innerText = "No news available!";
                    return;
                }

                let newsHTML = "";
                let tickerText = [];

                data.articles.forEach(article => {
                    tickerText.push(article.title);
                    newsHTML += `<tr class="border">
                        <td class="p-2">${article.title}</td>
                        <td class="p-2">${new Date(article.publishedAt).toLocaleString()}</td>
                        <td class="p-2"><a href="${article.url}" class="text-blue-600" target="_blank">Read More</a></td>
                    </tr>`;
                });

                newsContainer.innerHTML = newsHTML;
                newsTicker.innerText = tickerText.join(" | ");
                aiSummary.innerText = "✅ News updated!";
            })
            .catch(error => {
                console.error("Error fetching news:", error);
                document.getElementById("ai-summary").innerText = "❌ Error fetching news!";
            });
        });
    </script>
</body>
</html>
