<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://saal.ai/wp-content/uploads/2023/02/Medicine-Artifical-Intelligence.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 60%;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .header {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .data-section {
            margin-bottom: 15px;
            text-align: left;
            font-size: 18px;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .highlight {
            font-weight: bold;
            color: #007BFF;
        }
        .button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        .button:hover {
            background: #0056b3;
        }
    </style>
    <script>
        function updateHealthData() {
            document.getElementById("heartRate").innerText = Math.floor(Math.random() * (100 - 60) + 60) + " BPM";
            document.getElementById("bloodPressure").innerText = Math.floor(Math.random() * (130 - 90) + 90) + "/" + Math.floor(Math.random() * (90 - 60) + 60) + " mmHg";
            document.getElementById("oxygenLevel").innerText = Math.floor(Math.random() * (100 - 95) + 95) + "%";
            document.getElementById("temperature").innerText = (Math.random() * (99.5 - 97.0) + 97.0).toFixed(1) + "°F";
        }
        setInterval(updateHealthData, 3000);
    </script>
</head>
<body onload="updateHealthData()">
    <div class="container">
        <div class="header">Real-Time Health Data</div>
        
        <div class="data-section">
            ❤️ Heart Rate: <span id="heartRate" class="highlight">-- BPM</span>
        </div>
        
        <div class="data-section">
            🩸 Blood Pressure: <span id="bloodPressure" class="highlight">--/-- mmHg</span>
        </div>

        <div class="data-section">
            🌬️ Oxygen Saturation: <span id="oxygenLevel" class="highlight">--%</span>
        </div>
        
        <div class="data-section">
            🌡️ Body Temperature: <span id="temperature" class="highlight">--°F</span>
        </div>
        
        <button class="button" onclick="updateHealthData()">Refresh Data</button>
        <a href="dashboard.html" class="button" style="background: #6c757d;">Back to Dashboard</a>
    </div>
</body>
</html>
